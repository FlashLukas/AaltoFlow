  <circle cx="19" cy="14" r="4.2" fill="#ff9e2c"/>
  <path d="M26 19 C31 23 31 26 27 28" fill="none" stroke="#5a626e" stroke-width="1.8"/>
  <rect x="17" y="26" width="18" height="12" rx="2.5" fill="none" stroke="#5a626e" stroke-width="2.2"/>
