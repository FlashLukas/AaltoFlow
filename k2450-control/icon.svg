  <line x1="8.5" y1="20" x2="31.5" y2="20" stroke="#e8eaed" stroke-width="1.4"/>
  <line x1="20" y1="8.5" x2="20" y2="31.5" stroke="#e8eaed" stroke-width="1.4"/>
  <line x1="8.5" y1="11.5" x2="31.5" y2="11.5" stroke="#ffb454" stroke-width="1.6" stroke-dasharray="2.4 1.6"/>
