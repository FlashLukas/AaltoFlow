<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- 2D vector magnet: four pole pieces (an X pair and a Y pair) around the gap,
       and the field as an arrow at an angle. Colours are the DARK palette; the
       launcher swaps #ff9e2c / #ffb454 / #e8eaed for the active theme. -->
  <rect x="2" y="15" width="7" height="10" rx="1.5" fill="#5a626e"/>
  <rect x="31" y="15" width="7" height="10" rx="1.5" fill="#5a626e"/>
  <rect x="15" y="2" width="10" height="7" rx="1.5" fill="#5a626e"/>
  <rect x="15" y="31" width="10" height="7" rx="1.5" fill="#5a626e"/>
  <circle cx="20" cy="20" r="9.5" fill="none" stroke="#e8eaed" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="15" y1="25" x2="24" y2="16" stroke="#ff9e2c" stroke-width="3" stroke-linecap="round"/>
  <polygon points="28,12 19.5,14.5 25.5,20.5" fill="#ffb454"/>
</svg>
