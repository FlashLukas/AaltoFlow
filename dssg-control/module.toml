# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "dssg"
name = "RF generator (DS Instruments)"
description = "DS Instruments SG12000L 25 MHz - 12 GHz signal generator, USB or Ethernet"
category = "source"
tags = ["RF", "microwave", "signal generator", "DS Instruments", "SCPI", "Ethernet"]
