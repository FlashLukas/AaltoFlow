<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- HP 8648D: a CW signal generator drawn as what it produces: one spectral
       line on an analyser screen, under the stepped power ceiling (+13 dBm up
       to 2500 MHz, +10 dBm above). Colours: #ff9e2c accent, #ffb454 accent_hi,
       #e8eaed text, #5a626e metal; the launcher swaps the first three per theme. -->
  <rect x="4" y="6" width="32" height="27" rx="4" fill="none" stroke="#5a626e" stroke-width="2.2"/>
  <!-- the stepped ceiling -->
  <path d="M8 12 H24 V16 H32" fill="none" stroke="#e8eaed" stroke-width="1.6"
        stroke-dasharray="2.4 1.6" stroke-linecap="round"/>
  <!-- noise floor -->
  <path d="M8 28 L10 26.8 L12 28.2 L14 27 L16 28.3 L18 27.2 L22 28.1 L24 27 L26 28.3 L28 27.1 L30 28.2 L32 27.3"
        fill="none" stroke="#ffb454" stroke-width="1" stroke-linejoin="round" opacity="0.8"/>
  <!-- the carrier and its marker -->
  <line x1="19" y1="29" x2="19" y2="17.5" stroke="#ff9e2c" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M19 16.2 L16.2 12.8 H21.8 Z" fill="#ffb454"/>
  <!-- the front-panel feet: it is an instrument, not just a plot -->
  <line x1="9" y1="36" x2="13" y2="36" stroke="#5a626e" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="27" y1="36" x2="31" y2="36" stroke="#5a626e" stroke-width="2.2" stroke-linecap="round"/>
</svg>
