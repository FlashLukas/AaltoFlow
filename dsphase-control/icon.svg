<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- RF phase shifter: a phasor dial. Grey reference phasor at 0 deg, the
       amber shifted phasor at +60 deg, and the swept arc between them.
       Colours: #ff9e2c accent, #ffb454 accent_hi, #e8eaed text, #5a626e metal
       (the launcher swaps the first three for the active theme). -->
  <circle cx="20" cy="20" r="15" fill="none" stroke="#5a626e" stroke-width="2.2"/>
  <line x1="20" y1="20" x2="33" y2="20" stroke="#5a626e" stroke-width="2.2"
        stroke-dasharray="2.6 2" stroke-linecap="round"/>
  <path d="M 27 20 A 7 7 0 0 0 23.5 13.94" fill="none" stroke="#ffb454" stroke-width="2"/>
  <line x1="20" y1="20" x2="25.5" y2="10.5" stroke="#ff9e2c" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 27.4 7.2 L 23.4 9.3 L 27.6 11.7 Z" fill="#ff9e2c"/>
  <circle cx="20" cy="20" r="2" fill="#e8eaed"/>
</svg>
