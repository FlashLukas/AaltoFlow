# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "dsamp"
name = "RF amplifier"
description = "DS Instruments 6 GHz variable-gain RF amplifier (GB6000L family, USB)"
category = "source"
tags = ["RF", "amplifier", "gain", "DS Instruments", "USB serial"]
icon = "icon.svg"
order = 200

[ports]
cmd = 5593
pub = 5594

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []
