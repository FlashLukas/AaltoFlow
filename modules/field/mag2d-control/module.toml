# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "mag2d"
name = "2D vector magnet"
description = "Two-axis electromagnet on an NI DAQ: field magnitude + angle, PI in mT, water interlock"
category = "field"
tags = ["vector magnet", "two-axis", "NI DAQ", "rotation"]
icon = "icon.svg"
order = 110

[ports]
cmd = 5575
pub = 5576

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []
