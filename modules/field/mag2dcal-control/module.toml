# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "mag2dcal"
name = "2D vector magnet (calibrated)"
description = "Two-axis electromagnet: measured B(V) calibration, PI trim, freeze + stabilizer"
category = "field"
tags = ["vector magnet", "two-axis", "NI DAQ", "calibrated"]
icon = "icon.svg"
order = 120

[ports]
cmd = 5577
pub = 5578

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []
