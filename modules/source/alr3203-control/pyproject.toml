[project]
name = "alr3203-control"
version = "0.2.0"
license = "MIT"
description = "ELC ALR3203 32 V / 6 A supply for a magnet, bipolar through a polarity relay (USB serial), simulation first"
requires-python = ">=3.11"
# Runtime dependencies. Only pyzmq: the package imports and the simulator runs
# on ANY machine. The real backend's dependency is the optional extra `real`.
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# Optional extras. Name EVERY extra you want on each sync (gotcha #29):
#   uv sync --extra gui --extra real
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
real = [
    "pyserial>=3.5",  # the supply's USB link is a virtual COM port (ELC driver ALR32xx.inf)
]

# Importable code lives under src/ -- the "src layout".
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
