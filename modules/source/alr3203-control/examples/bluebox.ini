# EXAMPLE: the vacuum chamber's electromagnet (2026-11-09).
#   ELC ALR3203 (32 V / 6 A / 96 W) on its USB serial port; the polarity relay
#   on the NI USB-6001's line p0.0, switched THROUGH usb6001-control (5629) --
#   that service owns the DAQ card, so start it first, with p0.0 as an OUTPUT
#   (usb6001-control\examples\vacuum_magnet.ini).
#
# To use it: copy to ..\alr3203.ini (next to module.toml) and restart the
# service. The COM port is NOT here: Mission Control passes it (--com, chosen
# in "Instruments on this PC"); by hand: run_service.py --real --com COMx.
#
# Only what differs from the defaults is here.
[polarity]
driver = usb6001
host = 127.0.0.1
cmd_port = 5629
line = p0.0
# Which level of p0.0 means "inverted" is NOT known yet: set a small positive
# current, note the Hall probe's sign in usb6001, then a negative one -- if
# the field does not change sign, swap this to low.
inverted_level = high

# For the FIRST power-up you may want a lower ceiling than the full 6 A
# (Lukas's choice for normal use is the full range). Uncomment to cap it:
# [limits]
# current_max_A = 1.0
