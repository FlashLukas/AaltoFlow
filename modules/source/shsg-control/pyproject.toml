[project]
name = "shsg-control"
version = "0.3.0"
license = "MIT"
description = "Signal Hound USB-TG44A tracking generator as a CW source, driven through the signalhound service"
requires-python = ">=3.11"
# Runtime dependencies. No vendor library, ever: the real TG44A is reached
# through the signalhound service over ZeroMQ, so pyzmq is all it takes.
dependencies = [
    "pyzmq>=25",    # the control service + client, and the link to signalhound
]

# The GUI stack is optional so the headless core installs light. Get it with
#   uv sync --extra gui
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]

# Importable code lives under src/ -- the "src layout", same as clMag-control.
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
