[project]
name = "dsphase-control"
version = "0.2.0"
license = "MIT"
description = "DS Instruments PS6000L wideband digital RF phase shifter (USB virtual COM, SCPI), or a simulator"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# Optional parts, each asked for by name:
#   uv sync --extra gui                  the GUI (the headless core installs light)
#   uv sync --extra gui --extra real     + pyserial, for the real phase shifter (--real)
#
# Why pyserial is an EXTRA: the PS6000L is a USB virtual COM port that speaks
# plain ASCII lines, so pyserial is all it needs -- no vendor driver, no DLL.
# Trap (gotcha #29): `uv sync` REMOVES extras you do not name, so on the lab PC
# always sync with both.
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
real = [
    "pyserial>=3.5",     # the USB virtual COM port (backends/ps6000l.py, imported only in open())
]

# Importable code lives under src/ -- the "src layout", same as every module.
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
