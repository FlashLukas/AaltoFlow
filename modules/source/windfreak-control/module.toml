# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "windfreak"
name = "RF synthesizer"
description = "Windfreak SynthHD PRO v2 two-channel RF synthesizer"
category = "source"
tags = ["RF", "microwave", "signal generator", "synthesizer", "two-channel", "quadrature", "Windfreak"]
icon = "icon.svg"
order = 150

[ports]
cmd = 5583
pub = 5584

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []
