[project]
name = "windfreak-control"
version = "0.1.0"
license = "MIT"
description = "Windfreak SynthHD PRO v2 two-channel RF synthesizer control (USB serial), an AaltoFlow module"
requires-python = ">=3.11"
# Runtime dependencies. The hardware one (pyserial) lives in the extra "real",
# so the project installs and the simulator runs on ANY machine.
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# Optional extras:
#   uv sync --extra gui                  the Qt front panel
#   uv sync --extra gui --extra real     + pyserial for the real SynthHD
# (name BOTH: `uv sync` removes every extra you do not name, gotcha #29)
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
real = [
    "pyserial>=3.5",   # the SynthHD is a USB virtual COM port
]

# Importable code lives under src/ -- the "src layout".
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
