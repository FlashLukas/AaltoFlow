# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "kepco"
name = "Bipolar supply"
description = "Kepco BOP 20-10 bipolar supply: current or voltage mode, ramped setpoints, measured V and I (GPIB)"
category = "source"
tags = ["power supply", "bipolar", "current source", "Kepco", "GPIB"]
icon = "icon.svg"
order = 140

[ports]
cmd = 5581
pub = 5582

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []
excludes = ["clMag"]                 # never run together: clMag drives the SAME Kepco BOP (same GPIB address)
