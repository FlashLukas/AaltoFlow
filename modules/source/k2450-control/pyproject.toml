[project]
name = "k2450-control"
version = "0.2.0"
license = "MIT"
description = "Keithley 2450 SourceMeter (SMU) control over VISA/SCPI, with a simulator"
requires-python = ">=3.11"
# Runtime dependencies. The hardware ones live in the optional extra `real`, so
# the project installs and the simulator runs on ANY machine with no VISA.
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# The GUI stack is optional so the headless core installs light. Get it with
#   uv sync --extra gui
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
# The real instrument: uv sync --extra gui --extra real  (gotcha #29: a sync
# that does not name `real` uninstalls it again).
real = [
    "pyvisa>=1.13",     # VISA: USB-TMC / GPIB (NI-VISA or Keysight IO libraries)
    "pyvisa-py>=0.7",   # pure-Python VISA: LAN (socket 5025) with no vendor install
]

# Importable code lives under src/ -- the "src layout", same as clMag-control.
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
