[project]
name = "dssg-control"
version = "0.1.0"
license = "MIT"
description = "DS Instruments SG12000L USB/Ethernet microwave signal generator control (SCPI over virtual COM port or TCP)"
requires-python = ">=3.11"
# Runtime dependencies. Only pyzmq: the package imports and the simulator runs on
# ANY machine. The hardware dependency lives in the `real` extra below.
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

[project.optional-dependencies]
# The GUI stack is optional so the headless core installs light:
#   uv sync --extra gui
gui = [
    "PySide6>=6.7",
]
# The real instrument. Over USB the SG12000L is a virtual COM port -> pyserial.
# Over Ethernet it is a plain TCP socket -> the standard library, nothing to
# install. Sync BOTH extras on the lab PC (a later sync that names only `gui`
# would uninstall pyserial again -- gotcha #29):
#   uv sync --extra gui --extra real
real = [
    "pyserial>=3.5",
]

# Importable code lives under src/ -- the "src layout", same as every module.
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
