  <path d="M18 27 L22 13 L28 13 L24 27 Z" fill="none" stroke="#5a626e" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="25.5" y1="20" x2="37" y2="20" stroke="#e8eaed" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2.2"/>
  <line x1="25" y1="18" x2="36" y2="8" stroke="#ff9e2c" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="36" cy="8" r="2.2" fill="#ffb454"/>
