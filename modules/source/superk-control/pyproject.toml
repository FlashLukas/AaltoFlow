[project]
name = "superk-control"
version = "0.1.0"
license = "MIT"
description = "NKT SuperK EXTREME supercontinuum laser + SuperK SELECT AOTF control (NKT SDK)"
requires-python = ">=3.11"
# Runtime dependencies. The real laser needs NO pip package: it is driven
# through NKT's own NKTPDLL.dll (installed with the NKT SDK), loaded with the
# standard library's ctypes inside backends/nktp.py. So there is no `real` extra.
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# The GUI stack is optional so the headless core installs light. Get it with
#   uv sync --extra gui
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]

# Importable code lives under src/ -- the "src layout", same as clMag-control.
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
