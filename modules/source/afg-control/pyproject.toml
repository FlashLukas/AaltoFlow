[project]
name = "afg-control"
version = "0.2.0"
license = "MIT"
description = "Tektronix AFG1062 two-channel function generator control (USB-TMC / SCPI), an AaltoFlow module"
requires-python = ">=3.11"
# Runtime dependencies. The hardware one (pyvisa) lives in the extra "real",
# so the project installs and the simulator runs on ANY machine.
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# Optional extras:
#   uv sync --extra gui                  the Qt front panel
#   uv sync --extra gui --extra real     + pyvisa for the real AFG1062
# (name BOTH: `uv sync` removes every extra you do not name, gotcha #29)
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
real = [
    "pyvisa>=1.13",    # USB-TMC through a VISA library (NI-VISA or TekVISA)
]

# Importable code lives under src/ -- the "src layout".
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
