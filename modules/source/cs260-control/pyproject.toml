[project]
name = "cs260-control"
version = "0.1.0"
license = "MIT"
description = "Newport (Oriel) Cornerstone 260 1/4 m monochromator over GPIB: wavelength, grating, shutter, filter wheel, output port -- or a simulator"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# Optional parts, each asked for by name:
#   uv sync --extra gui                  the GUI (the headless core installs light)
#   uv sync --extra gui --extra real     + pyvisa, for the real CS260 (--real)
#
# pyvisa is an EXTRA rather than commented out so that switching to the real
# instrument does not mean editing (and committing) this file. It still needs a
# VISA library with a GPIB driver on the PC (NI-VISA + NI-488.2) at run time.
# Trap (gotcha #29): `uv sync` REMOVES extras you do not name, so on the lab PC
# always sync with both.
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
real = [
    "pyvisa>=1.13",    # GPIB via VISA (backends/cornerstone.py, imported only in open())
]

# Importable code lives under src/ -- the "src layout", same as every module.
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
