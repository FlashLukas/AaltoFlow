<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- Monochromator: light enters the housing (left), a grating fans it out,
       and one colour leaves through the exit slit (right).
       #5a626e metal, #e8eaed text/white light, #ff9e2c / #ffb454 accent. -->
  <rect x="5" y="8" width="30" height="24" rx="4" fill="none" stroke="#5a626e" stroke-width="2.2"/>
  <line x1="1" y1="14" x2="14" y2="21" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
  <rect x="13" y="16" width="3" height="10" rx="1" fill="#5a626e" transform="rotate(-18 14.5 21)"/>
  <line x1="15" y1="21" x2="30" y2="15" stroke="#ff9e2c" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="15" y1="21" x2="30" y2="27" stroke="#ff9e2c" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="15" y1="21" x2="39" y2="21" stroke="#ffb454" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="33" y1="12" x2="33" y2="18.5" stroke="#5a626e" stroke-width="2"/>
  <line x1="33" y1="23.5" x2="33" y2="30" stroke="#5a626e" stroke-width="2"/>
</svg>
