  <!-- sr7230: the analog panel meter of a lock-in: a scale arc with its
       overload end, the needle reading R against full scale, and the
       reference sine it is locked to. Colours: #5a626e metal, #e8eaed text,
       #ff9e2c accent, #ffb454 accent_hi (the launcher swaps the last three
       for the active theme). -->
