  <path d="M9 24 A11 11 0 0 1 28.5 17" fill="none" stroke="#e8eaed" stroke-width="2" stroke-linecap="round"/>
  <path d="M28.5 17 A11 11 0 0 1 31 24" fill="none" stroke="#ff9e2c" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="20" y1="24" x2="25.5" y2="14.5" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="24" r="2.2" fill="#ff9e2c"/>
  <path d="M9 30.5 q2.75 -3.2 5.5 0 t5.5 0 t5.5 0 t5.5 0" fill="none" stroke="#5a626e" stroke-width="1.6" stroke-linecap="round"/>
