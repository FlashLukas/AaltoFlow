[project]
name = "ls455-control"
version = "0.1.0"
license = "MIT"
description = "Lake Shore 455 DSP gaussmeter (single-axis Hall probe) over GPIB or RS-232"
requires-python = ">=3.11"
# Runtime dependencies. The hardware packages are in the optional extra `real`
# below, so the simulator runs on any PC.
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# The GUI stack is optional so the headless core installs light. Get it with
#   uv sync --extra gui
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",   # the live field history plot
]
# The real meter:  uv sync --extra gui --extra real   (gotcha #29: name BOTH)
# pyvisa talks to the instrument; it uses NI-VISA / Keysight IO Libraries when
# installed, else the pure-Python pyvisa-py, which needs pyserial for RS-232.
real = [
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
