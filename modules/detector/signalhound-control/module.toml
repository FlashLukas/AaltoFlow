# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "signalhound"
name = "Spectrum analyser (Signal Hound)"
description = "Signal Hound SA44B / SA124B spectrum analyser; owner of the USB-TG44A tracking generator, which the shsg (CW) and shsna (TG sweeps) modules use through it"
category = "detector"
tags = ["spectrum analyser", "tracking generator", "RF", "Signal Hound"]
icon = "icon.svg"
order = 170

[ports]
cmd = 5587
pub = 5588

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []

# Which analyser the service opens on real hardware: Mission Control's
# "Instruments on this PC" lists the serial numbers with scripts/probe.py
# (saGetSerialNumberList, opens none) and passes the chosen one as --serial <n>
# (suite_local.json, this PC). bus "device" = an id the module takes verbatim.
[hardware]
address_arg = "--serial"
bus = "device"
probe = "scripts/probe.py"
