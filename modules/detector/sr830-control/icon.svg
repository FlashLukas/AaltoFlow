<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- the SR830's range meter: an analogue dial (R against full scale) with
       its needle, above the reference sine. Accent (#ff9e2c / #ffb454) and
       text (#e8eaed) are theme-swapped by the launcher; #5a626e is the chassis. -->
  <rect x="3" y="5" width="34" height="30" rx="5" fill="none" stroke="#5a626e" stroke-width="2.2"/>
  <path d="M9.5 22 A10.5 10.5 0 0 1 30.5 22" fill="none" stroke="#e8eaed" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M26.6 14.6 A10.5 10.5 0 0 1 30.5 22" fill="none" stroke="#ffb454" stroke-width="3.2"/>
  <line x1="20" y1="22" x2="14.2" y2="13.6" stroke="#ff9e2c" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="20" cy="22" r="2.1" fill="#ffb454"/>
  <path d="M9 29.5 q2.75 -3.2 5.5 0 t5.5 0 t5.5 0 t5.5 0" fill="none" stroke="#ff9e2c" stroke-width="1.8" stroke-linecap="round"/>
</svg>
