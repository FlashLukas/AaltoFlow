# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "sr830"
name = "Lock-in (SR830)"
description = "Stanford Research SR830 DSP lock-in (100 kHz, GPIB): X, Y, R, theta, aux in/out, sine out"
category = "detector"
tags = ["lock-in", "Stanford Research", "GPIB", "detector"]
icon = "icon.svg"
order = 230

[ports]
cmd = 5599
pub = 5600

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []

# Which instrument the service opens on real hardware: Mission Control's
# "Instruments on this PC" offers a found visa address to this module and
# passes it to the service as --resource <address> (suite_local.json, this PC).
[hardware]
address_arg = "--resource"
bus = "visa"
