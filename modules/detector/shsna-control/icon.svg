<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- A scalar network analyser: the screen in metal, the dashed 0 dB line of
       the thru reference, and a band-pass transmission curve (flat top, steep
       skirts) in accent, its peak marked. Below, the two ports: the tracking
       generator OUT on the left, the analyser IN on the right, joined through
       the device under test. -->
  <rect x="4" y="5" width="32" height="24" rx="4" fill="none" stroke="#5a626e" stroke-width="2.4"/>
  <line x1="7.5" y1="11" x2="32.5" y2="11" stroke="#5a626e" stroke-width="1" stroke-dasharray="1.5 2"/>
  <path d="M7.5,25 C12,25 13,24 15,19 C16,15.5 17,13 20,13 C23,13 24,15.5 25,19 C27,24 28,25 32.5,25"
        fill="none" stroke="#ff9e2c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="20" cy="13" r="2.2" fill="#ffb454"/>
  <circle cx="9" cy="35" r="2" fill="none" stroke="#e8eaed" stroke-width="1.6"/>
  <circle cx="31" cy="35" r="2" fill="none" stroke="#e8eaed" stroke-width="1.6"/>
  <path d="M11,35 L17,35 M23,35 L29,35" stroke="#e8eaed" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="17" y="32.5" width="6" height="5" rx="1.2" fill="none" stroke="#ff9e2c" stroke-width="1.6"/>
</svg>
