# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "shsna"
name = "Scalar network analyser (Signal Hound)"
description = "Transmission |S21| with the Signal Hound analyser + USB-TG44A tracking generator, thru-normalised"
category = "detector"
tags = ["scalar network analyser", "tracking generator", "RF", "Signal Hound"]
icon = "icon.svg"
order = 370

[ports]
cmd = 5627
pub = 5628

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = ["signalhound"]
