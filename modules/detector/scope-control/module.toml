# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "scope"
name = "Oscilloscope"
description = "Two-channel oscilloscope (Siglent SDS1000CML+ / RS PRO RSDS1102CML+, or a Digilent Analog Discovery 2/3 with its W1/W2 generator and V+/V- supplies): averaged triggered traces in physical units, zero-phase filter, XY view"
category = "detector"
tags = ["oscilloscope", "scope", "waveform", "XY", "Siglent", "RS PRO", "Analog Discovery", "Digilent", "function generator", "power supply"]
icon = "icon.svg"
order = 400

[ports]
cmd = 5633
pub = 5634

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []

# Which instrument the service opens on real hardware: Mission Control's
# "Instruments on this PC" offers a found visa address to this module and
# passes it to the service as --visa <address> (suite_local.json, this PC).
[hardware]
address_arg = "--visa"
bus = "visa"
