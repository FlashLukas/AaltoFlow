[project]
name = "pm400-control"
version = "0.1.0"
license = "MIT"
description = "Thorlabs PM400 optical power / energy meter console with swappable heads (TLPMX driver via ctypes)"
requires-python = ">=3.11"
# Runtime dependencies. There is NO hardware package to uncomment here: the real
# backend calls Thorlabs' TLPMX_64.dll through Python's built-in ctypes. The DLL
# itself comes with Thorlabs Optical Parameter Monitor (OPM), installed on the
# lab PC. Same driver as pm16-control (verified there on real hardware).
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# The GUI stack is optional so the headless core installs light. Get it with
#   uv sync --extra gui
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",   # the live power history plot
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
