# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "hf2"
name = "Lock-in"
description = "Zurich HF2LI 50 MHz - 2 demodulator channels + aux inputs"
category = "detector"
tags = ["lock-in", "Zurich Instruments", "HF2LI"]
icon = "icon.svg"
order = 80

[ports]
cmd = 5569
pub = 5570

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []

# Which lock-in the service opens on real hardware: Mission Control's
# "Instruments on this PC" lists device ids with scripts/probe.py (LabOne
# discovery, no data-server session) and passes the chosen id as --device <id>
# (suite_local.json, this PC). bus "device" = an id the module takes verbatim.
[hardware]
address_arg = "--device"
bus = "device"
probe = "scripts/probe.py"
