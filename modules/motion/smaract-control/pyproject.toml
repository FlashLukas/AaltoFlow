[project]
name = "smaract-control"
version = "0.2.0"
license = "MIT"
description = "Control module for a SmarAct CLL42 linear positioner on an SCU controller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=25",
    # No pip dependency for the real hardware: the SmarAct SCU library is a
    # DLL from the controller's software CD, loaded with ctypes (backends/scu.py).
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
