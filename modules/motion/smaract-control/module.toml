# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "smaract"
name = "SmarAct linear stage"
description = "SmarAct CLL42 linear positioner (stick-slip, optical encoder) on an SCU controller"
category = "motion"
tags = ["stick-slip", "linear stage", "closed loop", "encoder", "fly scan", "SmarAct"]
icon = "icon.svg"
order = 220

[ports]
cmd = 5597
pub = 5598

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []
