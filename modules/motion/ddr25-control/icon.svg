<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- DDR25 rotation stage seen from above: the fixed graduated housing (metal),
       the platter with its bore, an amber pointer at the current angle and a
       rotation arrow. Colours: #ff9e2c accent, #ffb454 accent_hi, #e8eaed text,
       #5a626e metal (the launcher swaps the first three for the theme). -->
  <circle cx="20" cy="20" r="16" fill="none" stroke="#5a626e" stroke-width="2.6"/>
  <g stroke="#e8eaed" stroke-width="1.6" stroke-linecap="round">
    <line x1="20" y1="5.2" x2="20" y2="8.2"/>
    <line x1="34.8" y1="20" x2="31.8" y2="20"/>
    <line x1="20" y1="34.8" x2="20" y2="31.8"/>
    <line x1="5.2" y1="20" x2="8.2" y2="20"/>
  </g>
  <circle cx="20" cy="20" r="10" fill="none" stroke="#5a626e" stroke-width="1.8"/>
  <circle cx="20" cy="20" r="3.2" fill="none" stroke="#e8eaed" stroke-width="1.4"/>
  <line x1="22.3" y1="17.7" x2="28.5" y2="11.5" stroke="#ff9e2c" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M 9.4 13.6 A 12.4 12.4 0 0 1 16.2 8.2" fill="none" stroke="#ffb454" stroke-width="2" stroke-linecap="round"/>
  <path d="M 13.7 6.6 L 17.6 7.7 L 15.3 11.0 Z" fill="#ffb454"/>
</svg>
