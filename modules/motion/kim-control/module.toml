# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "kim"
name = "Inertia stage 3D"
description = "Thorlabs KIM101 + 3x PIA25 - sample XY + Z"
category = "motion"
tags = ["piezo inertia", "Thorlabs", "KIM101", "XYZ"]
icon = "icon.svg"
order = 60

[ports]
cmd = 5567
pub = 5568

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []

# Which KIM101 the service opens on real hardware: Mission Control's
# "Instruments on this PC" lists the controllers with scripts/probe.py (pylablib,
# list only) and passes the chosen Kinesis serial as --serial <serial>
# (suite_local.json, this PC). bus "device" = an id the module takes verbatim.
[hardware]
address_arg = "--serial"
bus = "device"
probe = "scripts/probe.py"
