# EXAMPLE: a vacuum chamber with an electromagnet on a bipolar supply.
#   ai0  vacuum gauge, logarithmic: p [mbar] = 10^(U - 5), live value = mean of 5
#        readings, lamp "ATM" at >= 1100 mbar
#   ai1  photodiode 1, DIFFERENTIAL (ai5 is its - input, so ai5 stays off)
#   ai2  Hall probe: B [mT] = (V[mV] - 5996.89) x (-0.0253199 mT/mV)
#        = -25.3199 mT/V x V + 151.8407 mT  (that probe's own constants)
#   ai3  photodiode 2
#   ai4  antenna sense: ao0 -- 2.2 kohm -- bias-tee DC port -- antenna -- ground,
#        ai4 (RSE) on the DC port; [resistance] measures the antenna's DC
#        resistance (~15 ohm) with +-9 V on ao0, ONLY while measuring.
#        Type the real R_ref (measured with a meter) into r_ref_ohm, and run
#        "Zero leads" once with the antenna end shorted.
#   p0.0 the magnet's polarity relay (an OUTPUT; the alr3203 module switches it)
# Timing as the old LabVIEW VI: 500 samples at 4 kS/s per channel.
# To use it: copy to ..\usb6001.ini (next to module.toml) and restart the service.
#
# usb6001-control configuration -- edit values, keep keys.
# [ai.aiN] / [ao.aoN] / [dio.pP.L]: one section per channel / line.
# enabled/terminal/direction apply at the NEXT service start.
[ai]
samples_per_read = 500
rate_hz = 4000.0

[ai.ai0]
enabled = True
name = Vacuum
terminal = RSE
unit = mbar
law = log10
slope = 1.0
offset = -5.0
smooth_reads = 5
lamp_above = 1100.0
lamp_name = ATM

[ai.ai1]
enabled = True
name = Photodiode 1
terminal = DIFF
unit = V
law = linear
slope = 1.0
offset = 0.0
smooth_reads = 1
lamp_above = nan
lamp_name = 

[ai.ai2]
enabled = True
name = Hall probe
terminal = RSE
unit = mT
law = linear
slope = -25.3199
offset = 151.84065511100002
smooth_reads = 1
lamp_above = nan
lamp_name = 

[ai.ai3]
enabled = True
name = Photodiode 2
terminal = RSE
unit = V
law = linear
slope = 1.0
offset = 0.0
smooth_reads = 1
lamp_above = nan
lamp_name = 

[ai.ai4]
enabled = True
name = Antenna sense
terminal = RSE
unit = V
law = linear
slope = 1.0
offset = 0.0
smooth_reads = 1
lamp_above = nan
lamp_name = 

[ai.ai5]
enabled = False
name = AI 5
terminal = RSE
unit = V
law = linear
slope = 1.0
offset = 0.0
smooth_reads = 1
lamp_above = nan
lamp_name = 

[ai.ai6]
enabled = False
name = AI 6
terminal = RSE
unit = V
law = linear
slope = 1.0
offset = 0.0
smooth_reads = 1
lamp_above = nan
lamp_name = 

[ai.ai7]
enabled = False
name = AI 7
terminal = RSE
unit = V
law = linear
slope = 1.0
offset = 0.0
smooth_reads = 1
lamp_above = nan
lamp_name = 

[ao]

[ao.ao0]
name = AO 0
min_v = -10.0
max_v = 10.0

[ao.ao1]
name = AO 1
min_v = -10.0
max_v = 10.0

[dio]

[dio.p0.0]
