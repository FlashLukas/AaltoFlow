# module.toml -- how the suite finds this module (INSTRUMENT_MODULE_GUIDE.md section 11).
# Identity only; the variables come from the running service's `describe`.

[module]
key = "usb6001"
name = "General DAQ (NI USB-6001)"
description = "NI USB-6001: analog inputs, two analog outputs, digital lines as inputs or outputs (set in the config, applied at start)"
category = "io"
tags = ["DAQ", "NI", "analog", "digital"]
icon = "icon.svg"
order = 380

[ports]
cmd = 5629
pub = 5630

[run]
service = "scripts/run_service.py"
gui = "scripts/run_gui.py"
start_after = []

# Which card the service opens on real hardware: Mission Control's
# "Instruments on this PC" lists the NI-DAQmx devices with scripts/probe.py (list
# only) and passes the chosen DAQmx name as --device <name> (suite_local.json,
# this PC). bus "device" = an id the module takes verbatim.
[hardware]
address_arg = "--device"
bus = "device"
probe = "scripts/probe.py"
