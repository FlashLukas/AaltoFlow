[project]
name = "usb6001-control"
version = "0.2.0"
license = "MIT"
description = "NI USB-6001 general-purpose DAQ: analog in/out, digital lines as inputs or outputs"
requires-python = ">=3.11"
# Runtime dependencies. The hardware one (nidaqmx) is in the optional extra
# `real`, so the project installs and the simulator runs on ANY machine without
# NI-DAQmx. On the lab PC:  uv sync --extra gui --extra real
# (name BOTH extras: `uv sync` removes every extra you leave out, gotcha #29)
dependencies = [
    "pyzmq>=25",    # the control service + client (localhost / Ethernet)
]

# The GUI stack is optional so the headless core installs light. Get it with
#   uv sync --extra gui
[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
# The real card: NI's Python API. Also needs the NI-DAQmx driver (runtime) from
# ni.com installed on the PC -- pip cannot install that part.
real = [
    "nidaqmx>=0.9",
]

# Importable code lives under src/ -- the "src layout", same as clMag-control.
[tool.setuptools.packages.find]
where = ["src"]

# Development-only tools (installed by `uv sync`, not shipped in an .exe).
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]  # 77+: `license = "MIT"` (PEP 639)
build-backend = "setuptools.build_meta"
