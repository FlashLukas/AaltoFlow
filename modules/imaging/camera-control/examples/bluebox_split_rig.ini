# EXAMPLE: the vacuum-chamber microscope ("split" rig, 2026-11-09).
#   camera  Thorlabs CS165MU (Zelux, 10-bit)      -> driver = thorlabs
#   XY      the SAMPLE on an Agilis AG-UC2 + 2 x AG-LS25 stages (agilis-control, 5595/5596)
#   Z       the OBJECTIVE on a KIM001 + PIA13      (kim001-control, 5637/5638)
#
# To use it on that PC: copy it over ..\camera.ini (the camera service loads
# camera.ini next to module.toml when started without --config), or start the
# service with  --config examples\bluebox_split_rig.ini . Do not commit a
# camera.ini from that PC: the tracked one is the other microscope's.
#
# Only what differs from the defaults is here; every other key keeps its
# default (load_config ignores missing keys).
#
# Before driver = thorlabs works, once per PC:
#   1. install ThorImageCAM (the camera's USB driver) and CLOSE it;
#   2. python scripts\setup_thorlabs_sdk.py <scientific_camera_interfaces-*.zip>
#      (unpacks the Python SDK to %LOCALAPPDATA%\AaltoFlow\vendor, where the
#      driver finds it -- see backends\thorlabs.py for why not pip).
#
# STILL TO MEASURE on the rig (then edit here or in the GUI and Save config):
#   xy_map  which way the Agilis axes move the image. Jog +X, then +Y, in the
#           camera GUI and read the direction: "+X+Y" = +X moves the image
#           right and +Y down; "+Y-X" = +Y moves it right, -X moves it down.
#   the objective / pixel size (Image section; objectives.ini).
[Camera]
driver = thorlabs
camera_name =

[Hardware]
motion = split
xy_stage = agilis
z_stage = kim001
xy_map = +X+Y
cam_device = 0
