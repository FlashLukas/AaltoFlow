  <rect x="5" y="7" width="30" height="27" rx="5" fill="none" stroke="#5a626e" stroke-width="2.4"/>
  <line x1="11" y1="23" x2="11" y2="15" stroke="#ff9e2c" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="12" stroke="#ff9e2c" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="21" y1="23" x2="21" y2="18" stroke="#ff9e2c" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M26 20 L31 14" stroke="#ffb454" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="26" cy="20" r="1.6" fill="#e8eaed"/>
  <circle cx="11" cy="29" r="1.7" fill="#ffb454"/>
