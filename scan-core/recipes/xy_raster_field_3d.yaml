name: xy_image_vs_field
comment: XY spatial image (raster, one UI axis = two data dims) at each field — 3-D data.
# A patterned sample: each island resonates at its own frequency, so at a FIXED
# drive frequency they come into resonance one after another as the field is
# swept. Every field slice is a different picture of the same array.
fixed: {rf_freq: 850, rf_power: 8, device_v: 0}
axes:
  - {type: linear, param: field, start: 0, stop: 75, num: 6}          # outer
  - {type: raster,                                                     # inner: 2 dims
     x: {param: pos_x, start: -45, stop: 45, num: 61},
     y: {param: pos_y, start: -45, stop: 45, num: 61},
     fast: x}
detectors: [lockin_r]
hooks: []
output: {dir: ., basename: xy_image_vs_field, format: netcdf}
settle: {default_timeout_s: 20.0}
