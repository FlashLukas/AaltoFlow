<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- TC200 heater: a sample block on a heater plate with a glowing zig-zag
       element, heat rising from it, and a thermometer beside it.
       #ff9e2c accent / #ffb454 accent_hi / #e8eaed text / #5a626e metal;
       the launcher swaps the first three for the active theme. -->
  <!-- heat shimmer -->
  <path d="M8 13 l2 -2 l-2 -2 l2 -2" fill="none" stroke="#ffb454" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15 13 l2 -2 l-2 -2 l2 -2" fill="none" stroke="#ffb454" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sample block -->
  <rect x="5" y="16" width="16" height="8" rx="1.5" fill="none" stroke="#e8eaed" stroke-width="2"/>
  <!-- heater plate -->
  <rect x="2.5" y="24" width="21" height="9" rx="2" fill="none" stroke="#5a626e" stroke-width="2"/>
  <!-- glowing element -->
  <path d="M5 28.5 l2 -2.5 l2 5 l2 -5 l2 5 l2 -5 l2 5 l2 -2.5" fill="none" stroke="#ff9e2c" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- thermometer -->
  <rect x="28.5" y="4" width="6" height="25" rx="3" fill="none" stroke="#5a626e" stroke-width="2"/>
  <circle cx="31.5" cy="32" r="5" fill="none" stroke="#5a626e" stroke-width="2"/>
  <circle cx="31.5" cy="32" r="3" fill="#ff9e2c"/>
  <rect x="30.3" y="14" width="2.4" height="17" rx="1.2" fill="#ff9e2c"/>
</svg>
